name: Release map worlds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (vMAJOR.MINOR.PATCH; existing or new)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Check out maps and world regions
        uses: actions/checkout@v5
        with:
          path: maps
          lfs: true

      - name: Select release revision
        shell: bash
        working-directory: maps
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Run releases from main.' >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git checkout --detach "$RELEASE_TAG"
          else
            echo 'CREATE_TAG=1' >> "$GITHUB_ENV"
          fi

      - name: Read tested component revisions
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifests = [json.loads(path.read_text()) for path in sorted(Path('maps/manifests').glob('*.json'))]
          if len(manifests) != 2:
              raise SystemExit('Expected exactly two map manifests')
          revisions = manifests[0]['repositories']
          if any(manifest['repositories'] != revisions for manifest in manifests[1:]):
              raise SystemExit('Map dependency revisions differ')
          for repository in ('datapacks', 'resourcepacks'):
              print(f'{repository}={revisions[repository]}')
          PY

      - name: Check out tested datapacks
        uses: actions/checkout@v5
        with:
          repository: Stews-Creations/zbk_datapacks
          ref: ${{ steps.refs.outputs.datapacks }}
          path: datapacks

      - name: Check out tested resource packs
        uses: actions/checkout@v5
        with:
          repository: Stews-Creations/zbk_resourcepacks
          ref: ${{ steps.refs.outputs.resourcepacks }}
          path: resourcepacks

      - name: Build and inspect portable worlds
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s maps/.github/scripts -p check_build_maps.py
          python3 maps/.github/scripts/build_maps.py --maps-root maps --sources-root . --output dist --verify-revisions --version "${RELEASE_TAG#v}"
          for map in nacht_der_untoten zbk_template; do
            mv "dist/$map.zip" "dist/$map-$RELEASE_TAG.zip"
          done
          (cd dist && sha256sum *.zip | tee SHA256SUMS.txt)

      - name: Create tag for new release
        if: env.CREATE_TAG == '1'
        shell: bash
        working-directory: maps
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        shell: bash
        working-directory: maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "../dist/nacht_der_untoten-$RELEASE_TAG.zip" \
            "../dist/zbk_template-$RELEASE_TAG.zip" \
            ../dist/SHA256SUMS.txt \
            --title "ZBK Maps $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
